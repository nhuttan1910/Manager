[client]
toolbarMode = "minimal"

[theme]
font = "Be Vietnam Pro:https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
headingFont = "Be Vietnam Pro"
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#12b886", "#4c6ef5", "#f59f00", "#f0525a", "#7950f2", "#15aabf", "#e64980", "#82c91e", "#fd7e14", "#868e96"]

[theme.light]
primaryColor = "#0ca678"
backgroundColor = "#f6f8fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2933"
borderColor = "#e3e8ee"
greenColor = "#0ca678"
redColor = "#e03131"

[theme.light.sidebar]
backgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#20c997"
backgroundColor = "#0f1417"
secondaryBackgroundColor = "#1a2127"
textColor = "#e6ebef"
borderColor = "#2a333b"
greenColor = "#20c997"
redColor = "#ff6b6b"

[theme.dark.sidebar]
backgroundColor = "#141a1f"
